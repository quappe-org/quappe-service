openapi: 3.1.0
info:
  title: Quappe Service API
  version: 0.5.2
  description: >
    The Quappe API — theses, arguments, votes, and derived reports. Single
    source of truth for all clients (web, future CLI/app/analytics). Identity is
    an anonymous server-minted JWT set as an httpOnly cookie (`quappe_uid`);
    clients never send a user id — the cookie is authoritative. This spec is the
    contract; keep it in sync when endpoints change.


    Two-world config: `AUTH_MODE=anonymous` (default, e.g. quappe.org) needs no
    login. `AUTH_MODE=gated` (business instance) requires a `/api/auth/login`
    call before any write; admin endpoints additionally accept the operator
    header `x-admin-secret`.
  license:
    name: PolyForm Noncommercial 1.0.0
    url: https://polyformproject.org/licenses/noncommercial/1.0.0
servers:
  - url: http://localhost:5273
    description: Local dev (service)
  - url: /
    description: Via quappe-web reverse proxy (/api/* → service)

tags:
  - name: theses
  - name: arguments
  - name: votes
  - name: reports
  - name: meta
  - name: auth
  - name: admin
  - name: import

paths:
  /api/theses:
    get:
      tags: [theses]
      summary: List theses (all / trending / top / crystallized)
      parameters:
        - { name: trending, in: query, schema: { type: boolean } }
        - { name: top, in: query, schema: { type: boolean } }
        - { name: crystallized, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Array of theses
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Thesis' } }
    post:
      tags: [theses]
      summary: Create a thesis (spends the daily thesis budget)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThesisCreate' }
      responses:
        '201':
          description: Created thesis (plus suggested_categories)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Thesis'
                  - type: object
                    properties:
                      suggested_categories:
                        type: array
                        items: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '422': { $ref: '#/components/responses/RegisterDrift' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/theses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [theses]
      summary: Get a thesis by id
      responses:
        '200':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Thesis' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [theses]
      summary: Edit a thesis (author only; free — no budget cost)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThesisUpdate' }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Thesis' } } } }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/RegisterDrift' }
    delete:
      tags: [theses]
      summary: Delete a thesis (author only)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/theses/{id}/vote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [votes]
      summary: Vote on a thesis (toggle; Fibonacci weight, base free)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteCast' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  vote_summary: { $ref: '#/components/schemas/VoteSummary' }
                  user_id: { type: string }
                  weight: { type: integer }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/theses/{id}/archive:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [theses]
      summary: Archive / unarchive a thesis (admin)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { archived: { type: boolean } } } } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/theses/{id}/related:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: limit, in: query, schema: { type: integer, default: 7 } }
    get:
      tags: [theses]
      summary: Related theses (semantic or thematic)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  related:
                    type: array
                    items:
                      type: object
                      properties:
                        thesis: { $ref: '#/components/schemas/Thesis' }
                        score: { type: number }
                  mode: { type: string, enum: [semantic, thematic] }

  /api/theses/{id}/translate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: to, in: query, required: true, schema: { type: string, enum: [en, de, fr, es] } }
    get:
      tags: [theses]
      summary: On-demand LLM translation of title + description (not persisted)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  title: { type: string }
                  description: { type: string }
                  target: { type: string }
        '503': { description: LLM unavailable }

  /api/theses/{id}/opinion-graph:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [theses]
      summary: >
        For each argument on the thesis, break down its approvers by their own
        vote on the thesis (support/reject/neutral). This is the emergent
        replacement for author-declared stance.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  thesis_id: { type: string, format: uuid }
                  arguments:
                    type: array
                    items:
                      type: object
                      properties:
                        argument_id: { type: string, format: uuid }
                        by_stance:
                          type: object
                          properties:
                            support: { type: integer }
                            reject: { type: integer }
                            neutral: { type: integer }

  /api/theses/{id}/edges:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [theses]
      summary: >
        Theses linked "as an argument" onto this thesis, each hydrated with its
        source thesis and its companion argument (which carries the vote_summary
        for the linked-thesis tile). Stanceless links — direction lives in the
        author's vote.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  edges:
                    type: array
                    items:
                      type: object
                      properties:
                        edge: { $ref: '#/components/schemas/ThesisEdge' }
                        thesis: { $ref: '#/components/schemas/Thesis' }
                        argument: { $ref: '#/components/schemas/Argument' }
        '404': { description: Thesis not found }
    post:
      tags: [theses]
      summary: >
        Link one of your theses onto this thesis as an argument. Requires a prior
        vote on this thesis (vote-first gate). The link carries no stance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_thesis_id]
              properties:
                source_thesis_id: { type: string, format: uuid }
      responses:
        '201':
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThesisEdge' }
        '400': { description: Missing source_thesis_id, self-link, or source thesis not found (code self_link / source_missing) }
        '403': { description: Must vote on the thesis first (code thesis_vote_required) }
        '404': { description: Target thesis not found }
        '409': { description: This thesis is already linked here (code edge_exists) }

  /api/theses/{id}/edges/{edgeId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: edgeId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [theses]
      summary: Remove a thesis-as-argument link (author only).
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403': { description: Only the author can remove this link (code not_edge_author) }
        '404': { description: Edge not found }

  /api/theses/draft-variant:
    post:
      tags: [theses]
      summary: LLM draft of a simple/dense description register (author tooling)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, variant]
              properties:
                title: { type: string }
                description: { type: string }
                variant: { type: string, enum: [simple, dense] }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  description: { type: string }
                  variant: { type: string }
                  drift:
                    type: object
                    description: >
                      Advisory similarity of the drafted variant to the prose
                      description. `ok:false` means it drifted below the
                      configured threshold; persisting it via POST/PUT would 422.
                    properties:
                      score: { type: number }
                      ok: { type: boolean }
                      threshold: { type: number }
        '503': { description: LLM unavailable }

  /api/theses/similar:
    get:
      tags: [theses]
      summary: >
        Strict near-duplicate probe (used by the create-thesis flow).
        Empty result means "your thesis looks new" — a common, correct case.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Thesis'
                        - type: object
                          properties:
                            _score: { type: number }

  /api/arguments:
    get:
      tags: [arguments]
      summary: List arguments for a thesis
      parameters:
        - { name: thesis_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Argument' } }
    post:
      tags: [arguments]
      summary: >
        Create an argument or fork variant (spends the daily argument budget).
        Requires a prior vote on the parent thesis (403 thesis_vote_required
        otherwise) — same gate as voting on arguments. A fork must keep the
        parent's text verbatim and extend it (add substantive content beyond
        the original); a fork that only echoes or trivially tweaks the parent
        is rejected with 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArgumentCreate' }
      responses:
        '201': { content: { application/json: { schema: { $ref: '#/components/schemas/Argument' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/arguments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [arguments]
      summary: Get an argument by id
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Argument' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [arguments]
      summary: Edit an argument (author only)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { content: { type: string } } } } }
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/Argument' } } } }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [arguments]
      summary: Delete an argument (author only)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/arguments/{id}/vote:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [votes]
      summary: >
        Vote on an argument. Requires a prior vote on the parent thesis;
        one vote per fork group (voting a variant moves it off siblings).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VoteCast' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  vote_summary: { $ref: '#/components/schemas/VoteSummary' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/search:
    get:
      tags: [theses]
      summary: Search theses (semantic with fulltext fallback)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/Thesis' } }
                  mode: { type: string, enum: [semantic, fulltext, combined, empty] }

  /api/stats:
    get:
      tags: [meta]
      summary: Heat + argument-count maps for all hot theses
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  heat: { type: object, additionalProperties: { type: number } }
                  arguments: { type: object, additionalProperties: { type: integer } }

  /api/categories:
    get:
      tags: [meta]
      summary: Distinct categories present across all theses (feed filter axis)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  categories: { type: array, items: { type: string } }

  /api/heat:
    get:
      tags: [meta]
      summary: Heat map (recent-activity ratio per thesis)
      responses:
        '200': { content: { application/json: { schema: { type: object, additionalProperties: { type: number } } } } }

  /api/activity:
    get:
      tags: [meta]
      summary: Activity calendar (platform-wide or per thesis)
      parameters:
        - { name: thesis_id, in: query, schema: { type: string, format: uuid } }
        - { name: days, in: query, schema: { type: integer, default: 84 } }
      responses:
        '200':
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ActivityDay' } }

  /api/budget/today:
    get:
      tags: [meta]
      summary: The caller's daily budget status + today's activity
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/BudgetStatus' } } } }

  /api/me:
    get:
      tags: [meta]
      summary: The caller's anonymous user id (from the JWT cookie)
      responses:
        '200': { content: { application/json: { schema: { type: object, properties: { user_id: { type: string } } } } } }

  /api/openapi:
    get:
      tags: [meta]
      summary: Serves this OpenAPI spec as raw YAML
      responses:
        '200':
          content:
            application/yaml:
              schema: { type: string }

  /api/reports/me:
    get:
      tags: [reports]
      summary: Personal activity report (LLM-flavoured)
      parameters:
        - name: register
          in: query
          required: false
          schema: { type: integer }
          description: >
            Reader's amount-slider value (max_arguments). The server snaps it to
            a FIB_ARGUMENTS notch and maps it to a 0-4 density step that drives
            the generated text's length. Omitted/invalid → fullest register.
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/reports/pulse:
    get:
      tags: [reports]
      summary: Community pulse (LLM summary + stats, 24h-cached)
      parameters:
        - name: register
          in: query
          required: false
          schema: { type: integer }
          description: >
            Reader's amount-slider value (max_arguments). The server snaps it to
            a FIB_ARGUMENTS notch and maps it to a 0-4 density step; each variant
            is pre-computed per locale. Omitted/invalid → fullest register.
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/PulseBody' } } } }

  /api/reports/updates:
    get:
      tags: [reports]
      summary: >
        The caller's update feed within the last 7 days. Aggregates forks of
        the caller's arguments, new arguments on the caller's theses, and
        lifecycle transitions on theses the caller supports. Self-actions and
        lifecycle events triggered by the caller's own recent activity are
        filtered out (Bug 2 fix).
      responses:
        '200': { content: { application/json: { schema: { $ref: '#/components/schemas/UpdatesBody' } } } }
    put:
      tags: [reports]
      summary: Mark update events as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_keys]
              properties:
                event_keys:
                  type: array
                  items: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/auth/login:
    post:
      tags: [auth]
      summary: >
        Gated-mode login. Presenting the admin secret elevates the identity
        cookie to role `admin`; the access secret elevates to `member`. In
        anonymous mode this endpoint returns 403 (login is a no-op there).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  role: { type: string, enum: [admin, member] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Invalid secret (`code: invalid_secret`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Login disabled (anonymous mode) }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Drop any elevated role, keeping the same anonymous identity
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /api/auth/status:
    get:
      tags: [auth]
      summary: The caller's auth mode + current role (client-config oracle)
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [anonymous, gated] }
                  role: { type: string, enum: [admin, member], nullable: true }
                  user_id: { type: string }
                  needs_login: { type: boolean }

  /api/admin/banner:
    get:
      tags: [admin]
      summary: Read the current site-wide banner (public)
      responses:
        '200':
          content:
            application/json:
              schema: { type: object, properties: { text: { type: string } } }
    put:
      tags: [admin]
      summary: Set (or clear) the site-wide banner text (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/logs:
    get:
      tags: [admin]
      summary: Ring-buffer server logs (hidden admin console)
      parameters:
        - { name: since, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500 } }
        - { name: level, in: query, schema: { type: string, enum: [debug, info, warn, error] } }
        - { name: source, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [admin]
      summary: Clear the log buffer (admin)
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/users:
    get:
      tags: [admin]
      summary: Distinct-voter counts (total + per-day) for the last N days
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, minimum: 1, maximum: 365 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users: { type: integer }
                  daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string }
                        voters: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/admin/reset:
    post:
      tags: [admin]
      summary: >
        Wipe all theses/arguments/votes/embeddings (business per-iteration
        reset). Requires admin AND the confirm header `x-confirm-reset: yes`.
      parameters:
        - name: x-confirm-reset
          in: header
          required: true
          schema: { type: string, enum: [yes] }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                keep_settings: { type: boolean, default: true }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/LoginRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/metrics:
    get:
      tags: [observability]
      summary: Prometheus text-format metrics scrape endpoint.
      security: []
      responses:
        '200':
          description: Metrics in Prometheus text exposition format (text/plain; version=0.0.4).
          content:
            text/plain:
              schema: { type: string }

  /api/events:
    get:
      tags: [observability]
      summary: >
        Durable event/history feed (append-only), cursor-paged. The thin
        read surface a tier-2 analytics consumer pulls from. Admin-gated.
        STUB in A0 — returns an empty page until emission (A1) + query (A2)
        land; history starts at that deploy (no back-fill of past activity).
      parameters:
        - { name: since, in: query, description: 'Cursor — the last event id already seen (0 = from start)', schema: { type: integer, default: 0, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 500, minimum: 1, maximum: 1000 } }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items: { $ref: '#/components/schemas/Event' }
                  next_cursor:
                    description: 'Pass as ?since= to resume; null when caught up.'
                    oneOf:
                      - { type: integer }
                      - { type: 'null' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /api/import/theses:
    post:
      tags: [import]
      summary: >
        Bulk upsert theses from an issue-tracker bridge. Requires the header
        `x-import-secret` matching `QUAPPE_IMPORT_SECRET`. Bypasses budget and
        rate limits; idempotent via `external_ref`.
      parameters:
        - name: x-import-secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [theses]
              properties:
                theses:
                  type: array
                  items:
                    type: object
                    required: [external_ref, title, description]
                    properties:
                      external_ref: { type: string }
                      title: { type: string }
                      description: { type: string }
                      categories: { type: array, items: { type: string } }
                      hashtags: { type: array, items: { type: string } }
                      archived: { type: boolean }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  created: { type: integer }
                  updated: { type: integer }
                  total: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        external_ref: { type: string }
                        id: { type: string, format: uuid }
                        created: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Missing or wrong x-import-secret }
    get:
      tags: [import]
      summary: List existing imported theses for a source (idempotent-sync helper)
      parameters:
        - name: x-import-secret
          in: header
          required: true
          schema: { type: string }
        - name: source
          in: query
          required: true
          schema: { type: string, example: 'github:owner/repo' }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  source: { type: string }
                  count: { type: integer }
                  refs:
                    type: array
                    items:
                      type: object
                      properties:
                        external_ref: { type: string }
                        id: { type: string, format: uuid }
                        title: { type: string }
        '401': { description: Missing or wrong x-import-secret }
    delete:
      tags: [import]
      summary: Purge all theses previously imported from a source
      parameters:
        - name: x-import-secret
          in: header
          required: true
          schema: { type: string }
        - name: source
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '401': { description: Missing or wrong x-import-secret }

components:
  responses:
    Ok: { description: Success }
    BadRequest: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    LoginRequired:
      description: >
        Gated-mode write attempted without a logged-in role. Call
        `/api/auth/login` first (or send `x-admin-secret` on admin endpoints).
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden: { description: Not allowed (e.g. not the author, or wrong admin secret), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooLarge: { description: Field or request body exceeds length cap }
    RateLimited: { description: Rate limit or daily budget exhausted, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    RegisterDrift:
      description: >
        A submitted reading-register variant (description_simple / description_dense)
        drifted too far in meaning from the prose description. Response body carries
        `drift_score` alongside the error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              drift_score: { type: number }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string, description: 'e.g. `login_required` (401 in gated mode)' }

    VoteType: { type: string, enum: [support, reject, neutral] }
    EvidenceType: { type: string, enum: [study, authority, logical, experiential] }
    LifecycleState: { type: string, enum: [seedling, discussed, contested, crystallized, faded, dormant] }
    UpdateKind: { type: string, enum: [fork, new_argument, lifecycle] }

    EventType:
      type: string
      description: >
        The minimal starting set of durable event types (A0). Extend
        deliberately — adding a type is a contract change.
      enum: [thesis.created, vote.cast, lifecycle.changed, thesis.archived, import.batch]

    Event:
      type: object
      description: >
        One append-only history record. Immutable once written. `id` is the
        monotonic paging cursor; `ts` is for human display/ordering.
      required: [id, ts, type, subject_id]
      properties:
        id: { type: integer, description: 'Monotonic cursor (pass back as ?since=).' }
        ts: { type: string, format: date-time, description: 'ISO-8601; display/ordering, not the cursor.' }
        type: { $ref: '#/components/schemas/EventType' }
        subject_id: { type: string, description: 'The thesis/argument/batch the event is about.' }
        actor_id:
          description: 'Who caused it (voter, author, or system:bridge). Absent for system-derived events like lifecycle.changed.'
          oneOf:
            - { type: string }
            - { type: 'null' }
        payload:
          type: object
          additionalProperties: true
          description: 'Type-specific detail, e.g. {from,to} for lifecycle.changed, {weight,type} for vote.cast.'

    Vote:
      type: object
      properties:
        user_id: { type: string }
        type: { $ref: '#/components/schemas/VoteType' }
        weight: { type: integer, description: 'Fibonacci ladder 1·2·3·5·8; base 1 is free' }
        cast_at: { type: string, format: date-time }

    VoteSummary:
      type: object
      properties:
        support: { type: integer, description: sum of weights }
        reject: { type: integer }
        neutral: { type: integer }
        total: { type: integer }
        voters: { type: integer, description: distinct users }

    VoteCast:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/VoteType' }
        weight: { type: integer, description: 'snapped to the Fibonacci ladder server-side' }

    Meta:
      type: object
      properties:
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        author_id: { type: string }
        location: { type: string, nullable: true }

    ArgumentAttribute:
      type: object
      properties:
        evidence_type: { $ref: '#/components/schemas/EvidenceType' }
        source_url: { type: string, nullable: true }

    Thesis:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        description_simple: { type: string, nullable: true, description: author reading register }
        description_dense: { type: string, nullable: true }
        categories: { type: array, items: { type: string } }
        hashtags: { type: array, items: { type: string } }
        votes: { type: array, items: { $ref: '#/components/schemas/Vote' } }
        related_thesis_ids: { type: array, items: { type: string } }
        archived: { type: boolean }
        lifecycle:
          type: object
          properties:
            state: { $ref: '#/components/schemas/LifecycleState' }
            state_since: { type: string, format: date-time }
            quality_score: { type: number }
        lang: { type: string, nullable: true }
        external_ref: { type: string, nullable: true, description: 'Set for bridge-imported theses' }
        meta: { $ref: '#/components/schemas/Meta' }

    ThesisEdge:
      type: object
      description: >
        A user-authored directed link: source thesis shown "as an argument" on
        the target thesis. Stanceless — never counts toward votes.
      properties:
        id: { type: string, format: uuid }
        source_thesis_id: { type: string, format: uuid }
        target_thesis_id: { type: string, format: uuid }
        author_id: { type: string }
        created_at: { type: string, format: date-time }

    ThesisCreate:
      type: object
      required: [title, description, categories]
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        categories: { type: array, items: { type: string }, minItems: 1, maxItems: 8 }
        location: { type: string }
        description_simple: { type: string, maxLength: 2000 }
        description_dense: { type: string, maxLength: 2000 }

    ThesisUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        categories: { type: array, items: { type: string } }
        description_simple: { type: string, maxLength: 2000, nullable: true }
        description_dense: { type: string, maxLength: 2000, nullable: true }

    Argument:
      type: object
      properties:
        id: { type: string, format: uuid }
        thesis_id: { type: string, format: uuid }
        content: { type: string }
        attributes: { type: array, items: { $ref: '#/components/schemas/ArgumentAttribute' } }
        votes: { type: array, items: { $ref: '#/components/schemas/Vote' } }
        forked_from_id: { type: string, format: uuid, nullable: true }
        linked_thesis_id:
          type: string
          format: uuid
          nullable: true
          description: >
            If set, this argument IS a thesis linked "as an argument" (companion
            row for a thesis_edge). content is empty; display text is the linked
            thesis title.
        categories: { type: array, items: { type: string }, nullable: true }
        hashtags: { type: array, items: { type: string }, nullable: true }
        meta: { $ref: '#/components/schemas/Meta' }

    ArgumentCreate:
      type: object
      required: [thesis_id, content]
      properties:
        thesis_id: { type: string, format: uuid }
        content: { type: string, maxLength: 800 }
        forked_from_id: { type: string, format: uuid }

    ActivityDay:
      type: object
      properties:
        date: { type: string, description: 'YYYY-MM-DD' }
        support: { type: integer }
        reject: { type: integer }
        neutral: { type: integer }
        creates: { type: integer }
        count: { type: integer }

    BudgetBucket:
      type: object
      properties:
        spent: { type: integer }
        limit: { type: integer }
        remaining: { type: integer }

    BudgetStatus:
      type: object
      properties:
        date: { type: string }
        theses: { $ref: '#/components/schemas/BudgetBucket' }
        support_args: { $ref: '#/components/schemas/BudgetBucket' }
        reject_args: { $ref: '#/components/schemas/BudgetBucket' }
        weight_points: { $ref: '#/components/schemas/BudgetBucket' }

    PulseBody:
      type: object
      properties:
        text: { type: string, nullable: true }
        generated_at: { type: string, format: date-time }
        stats: { type: object }
        llm: { type: object }

    UpdateEvent:
      type: object
      properties:
        kind: { $ref: '#/components/schemas/UpdateKind' }
        event_key: { type: string, description: stable id for read-tracking }
        read: { type: boolean }
        at: { type: string, format: date-time }
        thesis_id: { type: string, format: uuid }
        thesis_title: { type: string }
        original_argument_id: { type: string, format: uuid }
        original_content: { type: string }
        original_votes: { type: integer }
        fork_argument_id: { type: string, format: uuid }
        fork_content: { type: string }
        fork_votes: { type: integer }
        argument_id: { type: string, format: uuid }
        argument_content: { type: string }
        lifecycle_state: { $ref: '#/components/schemas/LifecycleState' }

    UpdateGroup:
      type: object
      description: >
        Per-thesis rollup of the raw events. The personal feed on the web
        client renders one card per group. `event_keys` lets the client PUT
        the whole group as read in a single call.
      properties:
        thesis_id: { type: string, format: uuid }
        thesis_title: { type: string }
        last_at: { type: string, format: date-time, description: newest underlying event }
        read: { type: boolean, description: true only when every underlying event is read }
        new_arguments: { type: integer, description: count of foreign arguments on my thesis in the window }
        forks: { type: integer, description: count of forks of my arguments on this thesis }
        lifecycle_state:
          allOf:
            - $ref: '#/components/schemas/LifecycleState'
          description: latest transition, if any occurred
        lifecycle_since: { type: string, format: date-time, description: when that transition happened }
        event_keys:
          type: array
          items: { type: string }

    UpdatesBody:
      type: object
      properties:
        user_id: { type: string }
        generated_at: { type: string, format: date-time }
        events: { type: array, items: { $ref: '#/components/schemas/UpdateEvent' } }
        groups: { type: array, items: { $ref: '#/components/schemas/UpdateGroup' } }
        counts:
          type: object
          properties:
            forks: { type: integer }
            new_arguments: { type: integer }
            lifecycle: { type: integer }
            total: { type: integer, description: total raw events }
            groups: { type: integer, description: number of per-thesis groups }
            unread: { type: integer, description: unread raw events }
            unread_groups: { type: integer, description: groups with at least one unread event — the number to badge }

  securitySchemes:
    quappeCookie:
      type: apiKey
      in: cookie
      name: quappe_uid
      description: >
        Anonymous server-minted JWT. Set automatically; do not send a user id
        in bodies. In gated mode, calling `/api/auth/login` elevates the same
        cookie to `role: admin` or `role: member`.
    adminSecretHeader:
      type: apiKey
      in: header
      name: x-admin-secret
      description: >
        Operator/bridge credential. Accepted on all `/api/admin/*` endpoints
        even in gated mode (bypasses the cookie-login wall). Matches
        `QUAPPE_ADMIN_SECRET`.
    importSecretHeader:
      type: apiKey
      in: header
      name: x-import-secret
      description: >
        Bridge credential for `/api/import/*`. Matches `QUAPPE_IMPORT_SECRET`.
        If the env var is unset, all import endpoints return 401.

security:
  - quappeCookie: []
